services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

  db_users:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user_service:
    build: ./user_service
    container_name: user_service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db_users:5432/usersdb"
      SECRET_KEY: "ultra-secure-key"
    depends_on:
      db_users:
        condition: service_healthy
    ports:
      - "5001:5001"

  content_service:
    build: ./content_service
    container_name: content_service
    depends_on:
      - kafka
    ports:
      - "50051:50051"

  api_gateway:
    build: ./api_gateway
    container_name: api_gateway
    environment:
      USER_MICROSERVICE_URL: "http://user_service:5001"
      POST_MICROSERVICE_HOST: "content_service:50051"
      AUTH_SECRET: "ultra-secure-key"
    depends_on:
      - user_service
      - content_service
    ports:
      - "3000:3000"

volumes:
  postgres_data: